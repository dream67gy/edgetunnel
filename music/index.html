<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102c63">
<meta name="description" content="听一段旋律，找回熟悉的歌名。">
<title>题目 {{LETTER}} · 听歌识曲</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23102c63'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='29' fill='%23e7c98b'%3E♪%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{CSS}}">
<script src="{{JS}}" defer></script>
</head>
<body>
<main class="quiz">
  <header><a href="/music/" class="brand">听歌识曲 <span>LISTEN & GUESS</span></a><span class="question-number">题目 {{LETTER}}</span></header>
  <section class="player-card quiz-card" aria-labelledby="title">
    <div class="card-intro"><p class="eyebrow">A MELODY, A MEMORY</p>
    <h1 id="title">这一首，你听过吗？</h1>
    <p class="intro">让熟悉的旋律，唤醒你的音乐记忆。</p></div>
    <div class="record-scene" aria-hidden="true"><div class="record-halo"></div><span class="spark one">✦</span><div class="record"><div class="record-label"><span>TRACK</span><b>{{LETTER}}</b><i></i></div></div><span class="spark two">✧</span></div>
    <div class="listening-panel"><div class="track-heading"><span>题目 {{LETTER}} <small>神秘旋律</small></span><div class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
    <audio id="audio" controls preload="none" playsinline aria-label="题目 {{LETTER}} 的音乐" src="{{AUDIO}}">你的浏览器暂不支持音频播放。</audio>
    <div id="controls" class="custom-controls" hidden>
      <div class="progress"><label class="sr-only" for="seek">播放进度</label><input id="seek" type="range" min="0" max="1000" step="1" value="0" disabled aria-valuetext="尚未开始播放"><div class="times" aria-hidden="true"><span id="elapsed">0:00</span><span id="duration">--:--</span></div></div>
      <button id="play" class="play-button" type="button" aria-label="开始播放音乐"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="play-icon" d="M8 5v14l11-7Z"/><path class="pause-icon" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg><span id="play-label">开始聆听</span></button>
      <div class="player-footer"><p id="status" role="status">点击播放，让旋律给你线索。</p><button id="replay" type="button" aria-label="从头重新播放音乐">↺ 重听</button></div>
      <p class="error" id="error" role="alert" hidden>音乐暂时未能播放，请检查网络后重试。<button id="retry" type="button">重新播放</button></p>
    </div></div>
  </section>
  <p class="tip">戴上耳机，或适当调高音量，别错过旋律里的线索。</p>
  <footer><span>听见旋律 · 猜中惊喜</span><span>JUST PRESS PLAY</span></footer>
</main>
</body>
</html>
